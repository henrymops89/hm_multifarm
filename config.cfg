-- ================================================
-- HELPER FUNCTIONS
-- ================================================

function Config.GetCowType(id)
    for _, cowType in ipairs(Config.CowTypes) do
        if cowType.id == id then
            return cowType
        end
    end
    return nil
end

function Config.GetSlotById(slotId)
    for _, slot in ipairs(Config.Slots) do
        if slot.id == slotId then
            return slot
        end
    end
    return nil
end

